<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>l’appel du vide — Lev × Simard</title>
<meta name="theme-color" content="#07060C">
<meta property="og:type" content="music.album">
<meta property="og:title" content="l’appel du vide — Lev × Simard">
<meta property="og:url" content="https://lappelduvide.pages.dev/">
<meta property="og:image" content="https://lappelduvide.pages.dev/assets/pochette-titre.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="1200">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="css/site.css">
<!-- la lumière est posée avant le premier rendu pour éviter un passage par la nuit -->
<script>document.documentElement.dataset.heure=(h=>h>=10&&h<18?'jour':'nuit')(new Date().getHours())</script>
</head>
<body>

<!-- la lumière du site : jour ou nuit, selon l’heure locale du visiteur ou le switch de l’en-tête -->
<div class="ciel" aria-hidden="true"></div>

<!-- rivière de paroles en fond : texture peinte une fois par js/site.js, mise en rotation lente -->
<div class="river" aria-hidden="true">
  <div class="river-tex" id="river-tex"></div>
  <div class="river-scrim"></div>
</div>

<div class="page">

  <header class="brand">
    <span class="brand-nom">LEV × SIMARD</span>
    <nav class="heures" id="heures" aria-label="Lumière du site"></nav>
  </header>

  <section class="hero" id="accueil">
    <h1 class="titre">l’appel du vide</h1>
    <p class="hero-quote">t'as le monde dans les mains, j'ai des rêves dans les yeux, j'aimerais pouvoir aider en exauçant les voeux</p>
  </section>

  <section class="pochette" id="pochette" aria-label="La pochette en dix pièces">
    <div class="puzzle" id="puzzle"></div>
    <div class="puzzle-tools">
      <button type="button" class="lien" id="flip-all">TOUT RETOURNER</button>
    </div>
  </section>

  <!-- les titres, et à gauche le livret : dix cartes à foil empilées en éventail -->
  <section class="titres" id="titres" aria-label="Les titres">
    <div class="cartes" id="cartes" aria-label="Le livret"></div>
    <div class="tracklist" id="tracklist"></div>
  </section>

  <!-- l’objet : le vinyle en deux pressages (Prolongements 1f) -->
  <section class="objet" id="objet" aria-label="Le vinyle">
    <div class="pressages" id="pressages"></div>
  </section>

  <footer class="pied">LEV × SIMARD · 10 TITRES · 22:33</footer>

</div>

<!-- une carte du livret ouverte en grand : elle s’envole depuis sa place, le foil suit la souris -->
<div class="carte-vue" id="carte-vue" role="dialog" aria-modal="true" aria-label="Carte du livret" hidden>
  <div class="carte-bar"><button type="button" class="lien" id="carte-close">fermer</button></div>
  <button type="button" class="carte-nav carte-prev" id="carte-prev" aria-label="Carte précédente">‹</button>
  <button type="button" class="carte-nav carte-next" id="carte-next" aria-label="Carte suivante">›</button>
  <div class="carte-scene" id="carte-scene">
    <div class="carte-flip" id="carte-flip">
      <div class="carte-face carte-recto">
        <div class="grande-holo" id="grande-holo" aria-hidden="true"></div>
        <div class="grande-sheen" id="grande-sheen" aria-hidden="true"></div>
        <div class="grande-stripes" id="grande-stripes" aria-hidden="true"></div>
        <span class="carte-tourner" aria-hidden="true">retourner ↻</span>
        <div class="carte-txt">
          <span class="carte-titre" id="carte-titre"></span>
          <span class="carte-quote" id="carte-quote"></span>
        </div>
      </div>
      <div class="carte-face carte-verso">
        <span class="verso-vers" id="verso-vers"></span>
        <button type="button" class="verso-play" id="verso-play">écouter →</button>
      </div>
    </div>
  </div>
</div>

<!-- lecteur plein écran : la pochette du single s’envole depuis sa vignette, s’anime en WebGL pendant la lecture -->
<div class="player" id="player" role="dialog" aria-modal="true" aria-label="Lecteur" hidden>
  <div class="player-glow" id="p-glow" aria-hidden="true"></div>
  <div class="player-bar">
    <span class="player-index" id="p-index"></span>
    <button type="button" class="lien" id="p-close">fermer</button>
  </div>
  <div class="player-img" id="p-img" role="button" tabindex="0" aria-label="Lecture / pause">
    <div class="player-img-static" id="p-static-prev"></div>
    <div class="player-img-static" id="p-static"></div>
    <div class="player-live" id="p-live"></div>
    <div class="player-img-play" aria-hidden="true">
      <svg class="glyph-play" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30"/><path d="M26.5 20.5 L45.5 32 L26.5 43.5 Z"/></svg>
      <svg class="glyph-pause" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30"/><path d="M26 22 V42 M38 22 V42"/></svg>
    </div>
  </div>
  <div class="player-text" id="p-text">
    <div class="player-head">
      <span class="player-title" id="p-title"></span>
      <span class="player-meta" id="p-meta"></span>
    </div>
    <div class="player-lyrics" id="p-lyrics"></div>
    <div class="player-controls">
      <div class="seek" id="p-seek" aria-label="Position dans le titre">
        <div class="seek-rail"></div>
        <div class="seek-fill" id="p-fill"></div>
        <div class="seek-knob" id="p-knob"></div>
      </div>
      <div class="transport">
        <button type="button" class="nav" id="p-prev">← précédent</button>
        <button type="button" class="play" id="p-play">LECTURE</button>
        <button type="button" class="nav" id="p-next">suivant →</button>
      </div>
      <div class="times"><span id="p-elapsed">0:00</span><span id="p-dur"></span></div>
    </div>
  </div>
</div>

<noscript>
  <ol class="noscript">
    <li>intro</li><li>vieux messages</li><li>sidehustle</li><li>buisness model</li><li>l’appelduvide</li>
    <li>imperméable</li><li>long fleuve</li><li>sésame interlude</li><li>dequoituparles!</li><li>persephone</li>
  </ol>
</noscript>

<script src="js/cover-live.js"></script>
<script src="js/site.js"></script>
</body>
</html>
